server:
  port: 8080

spring:
  application:
    name: event-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/event_manager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /index.html
    #url: openapi/event-manager-openapi.yaml
    tryItOutEnabled: true
    persistAuthorization: true
    withCredentials: true


jwt:
  ttl: 86400000
  key: 'd878fede59078e89bcf10c2c5eb43d760c426035362af8caa237eda1671e14e0'
