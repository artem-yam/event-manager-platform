databaseChangeLog:
  - changeSet:
      id: 0003-create-event
      author: artem-yam
      changes:
        - createTable:
            tableName: event
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: max_places
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: occupied_places
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: cost
                  type: NUMERIC
                  constraints:
                    nullable: false
              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: event
            baseColumnNames: location_id
            referencedTableName: location
            referencedColumnNames: id
            constraintName: fk_event_location
        - addForeignKeyConstraint:
            baseTableName: event
            baseColumnNames: owner_id
            referencedTableName: user_account
            referencedColumnNames: id
            constraintName: fk_event_owner
