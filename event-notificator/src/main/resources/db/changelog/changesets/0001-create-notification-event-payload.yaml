databaseChangeLog:
  - changeSet:
      id: 0001-create-notification-event-payload
      author: artem-yam
      changes:
        - createTable:
            tableName: notification_event_payload
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: event_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
              - column:
                  name: changed_by_id
                  type: BIGINT
              - column:
                  name: payload_json
                  type: JSONB
                  constraints:
                    nullable: false
